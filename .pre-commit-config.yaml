# Hooks that run before every commit. Set up once with:
#   pip install pre-commit && pre-commit install
# Run on every file with: pre-commit run --all-files
# CI runs the same hooks (.github/workflows/pre-commit.yml).
repos:
  # Secret scanning: blocks commits that contain API keys, tokens, passwords, etc.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: forbid-submodules
